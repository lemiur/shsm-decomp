# Data words that happen to fall inside libjpeg functions (table values, not
# pointers); as relocations they would target jdmarker's static functions.
block_relocations:
  - source: .data:0x80401810
  - source: .data:0x80424184
  # jquant1 base_dither_matrix row 1 (bytes 80 40 B0 70), not a pointer.
  - source: .rodata:0x803DA708
  # vi3in1 gammaSet[10].yout[5..6] (0x8000, 0xA000), not a pointer.
  - source: .data:0x8043C0E8
  # zlib crc32 crc_table (CRC words, not pointers).
  - source: .rodata:0x803DA948
    end: .rodata:0x803DC948
  # WPADEncrypt tb[0xA4..0xA7] (bytes 80 1D 0E B0), not a pointer.
  - source: .data:0x80448084
  # OSInit: lis r4, 0x8000 serves the low-memory load 0x310C(r4) and the constant
  # arena start 0x80004000 (addi r3, r4, 0x4000); a number, not gTRKInterruptVectorTable.
  - source: .text:0x80211458
  - source: .text:0x802114CC

# zlib inflate: fixedtables() (inlined) addresses lenfix through a spilled high half
# (lis r0 / stw / lwz / addi), which dtk's analysis does not pair.
add_relocations:
  - source: .text:0x801CAB34
    type: ha
    target: "@LOCAL@fixedtables__Fe@lenfix"
  - source: .text:0x801CAB6C
    type: l
    target: "@LOCAL@fixedtables__Fe@lenfix"
